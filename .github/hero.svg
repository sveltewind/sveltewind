<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Sveltewind - build your interface, make it yours</title>
  <desc id="desc">A dark violet banner with a preview of buttons, a status badge, and independently selectable styles and colors.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171124"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="1070" cy="40" r="260" fill="#8b5cf6" opacity=".07"/>
  <circle cx="30" cy="510" r="230" fill="#8b5cf6" opacity=".05"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="68" width="40" height="40" rx="12" fill="url(#accent)"/>
    <path d="M75 82h18l-7 8h7l-18 12 6-12h-6z" fill="white"/>
    <text x="118" y="98" font-size="30" font-weight="700" fill="#fafafa">sveltewind</text>
    <text x="64" y="170" font-size="12" font-weight="600" letter-spacing="3" fill="#c4b5fd">SVELTE 5 + TAILWIND CSS 4</text>
    <text x="60" y="231" font-size="49" font-weight="700" fill="#fafafa">Build your interface.</text>
    <text x="60" y="292" font-size="49" font-weight="700" fill="#c4b5fd">Make it yours.</text>
    <text x="64" y="343" font-size="19" fill="#a1a1aa">Composable components. Shared themes.</text>
    <text x="64" y="375" font-size="19" fill="#a1a1aa">Your style, your colors, everywhere.</text>
    <rect x="64" y="423" width="182" height="44" rx="10" fill="#8b5cf6"/>
    <text x="88" y="451" font-size="14" font-family="Consolas, monospace" fill="white">npm i sveltewind</text>
    <rect x="656" y="76" width="480" height="388" rx="18" fill="#18181b" stroke="#3f354f"/>
    <circle cx="682" cy="101" r="4" fill="#71717a"/><circle cx="698" cy="101" r="4" fill="#71717a"/><circle cx="714" cy="101" r="4" fill="#71717a"/>
    <text x="1110" y="105" text-anchor="end" font-size="11" fill="#a1a1aa">COMPONENT PREVIEW</text>
    <path d="M656 120h480" stroke="#302936"/>
    <text x="684" y="163" font-size="21" font-weight="600" fill="#fafafa">One system. Endless possibilities.</text>
    <text x="684" y="190" font-size="14" fill="#a1a1aa">Start with primitives. Compose something great.</text>
    <rect x="684" y="217" width="122" height="42" rx="9" fill="#8b5cf6"/>
    <text x="745" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="white">Get started</text>
    <rect x="818" y="217" width="108" height="42" rx="9" fill="#8b5cf6" fill-opacity=".1" stroke="#8b5cf6"/>
    <text x="872" y="243" text-anchor="middle" font-size="14" fill="#c4b5fd">Explore</text>
    <rect x="984" y="228" width="122" height="24" rx="12" fill="#052e16" stroke="#166534"/>
    <text x="1045" y="245" text-anchor="middle" font-size="12" fill="#bbf7d0">&#10003; Ready to build</text>
    <path d="M684 285h424" stroke="#302936"/>
    <text x="684" y="316" font-size="12" fill="#a1a1aa">STYLE</text>
    <g font-size="12" text-anchor="middle">
      <rect x="684" y="331" width="77" height="32" rx="6" fill="#302442" stroke="#8b5cf6"/><text x="722" y="352" fill="#ddd6fe">Classic</text>
      <rect x="769" y="331" width="77" height="32" rx="4" fill="#27272a"/><text x="807" y="352" fill="#d4d4d8">Minimal</text>
      <rect x="854" y="331" width="77" height="32" fill="#27272a"/><text x="892" y="352" fill="#d4d4d8">Sharp</text>
      <rect x="939" y="331" width="77" height="32" rx="16" fill="#27272a"/><text x="977" y="352" fill="#d4d4d8">Soft</text>
      <rect x="1024" y="331" width="77" height="32" rx="8" fill="#27272a"/><text x="1062" y="352" fill="#d4d4d8">Studio</text>
    </g>
    <text x="684" y="399" font-size="12" fill="#a1a1aa">COLOR</text>
    <circle cx="774" cy="395" r="13" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="814" cy="395" r="11" fill="#f43f5e"/><circle cx="854" cy="395" r="11" fill="#0ea5e9"/>
    <circle cx="894" cy="395" r="11" fill="#10b981"/><circle cx="934" cy="395" r="11" fill="#f59e0b"/>
    <circle cx="974" cy="395" r="11" fill="#64748b"/>
    <text x="684" y="438" font-size="12" fill="#71717a">Independent styles and palettes &#183; Light and dark mode</text>
  </g>
</svg>
