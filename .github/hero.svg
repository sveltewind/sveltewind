<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Sveltewind - Everything included. Nothing locked down.</title>
  <desc id="description">The Sveltewind landing page hero in its dark violet theme: introduction and navigation links beside the four-step Included, Theme it, Add a variant, and Reuse it component demonstration.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".13"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#8b5cf6" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1200" height="600" fill="#0a090b"/>
  <ellipse cx="1090" cy="180" rx="360" ry="310" fill="url(#glow)"/>
  <g font-family="Figtree, Inter, Segoe UI, Arial, sans-serif">
    <text x="56" y="143" fill="#a5a0b1" font-size="11" font-weight="500" letter-spacing="2.75">SVELTE 5 COMPONENT SYSTEM</text>
    <text x="53" y="217" fill="#faf9fa" font-size="50" font-weight="700" letter-spacing="-1.75">Everything included.</text>
    <text x="53" y="275" fill="#a78bfa" font-size="50" font-weight="700" letter-spacing="-1.75">Nothing locked down.</text>
    <g fill="#a5a0b1" font-size="18">
      <text x="56" y="321">A complete Svelte 5 component system powered by one</text>
      <text x="56" y="350">reactive JavaScript theme. Start with ready-to-use</text>
      <text x="56" y="379">components, then extend, replace, variant, and</text>
      <text x="56" y="408">compose them however you want.</text>
    </g>
    <a href="https://sveltewind.com/getting-started/what-is-sveltewind">
      <rect x="56" y="445" width="174" height="52" rx="8" fill="#8b5cf6"/>
      <text x="80" y="477" fill="white" font-size="16" font-weight="500">Get Started</text>
      <path d="M194 471h14m-5-5 5 5-5 5" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </a>
    <a href="https://sveltewind.com/components">
      <rect x="246" y="445" width="211" height="52" rx="8" fill="none" stroke="#3b3743"/>
      <text x="351.5" y="477" text-anchor="middle" fill="#faf9fa" font-size="16" font-weight="500">Explore Components</text>
    </a>
    <text x="56" y="540" fill="#a5a0b1" font-size="9" letter-spacing="1.8">OPEN SOURCE &#8226; BUILT FOR SVELTE 5 &#8226; READY TO MAKE YOURS</text>
    <g filter="url(#card-shadow)">
      <rect x="666" y="91" width="478" height="438" rx="12" fill="#0d0c10" stroke="#3b3743" stroke-opacity=".7"/>
    </g>
    <path d="M666 155h478" stroke="#3b3743" stroke-opacity=".5"/>
    <rect x="674" y="99" width="112" height="48" rx="8" fill="#222027" fill-opacity=".7"/>
    <circle cx="696" cy="123" r="14" fill="#8b5cf6"/>
    <text x="696" y="127" fill="white" font-size="12" text-anchor="middle">1</text>
    <text x="718" y="127" fill="#faf9fa" font-size="11">Included</text>
    <circle cx="815" cy="123" r="14" fill="#222027"/>
    <text x="815" y="127" fill="#cfcdd6" font-size="12" text-anchor="middle">2</text>
    <text x="837" y="127" fill="#faf9fa" font-size="11">Theme it</text>
    <circle cx="934" cy="123" r="14" fill="#222027"/>
    <text x="934" y="127" fill="#cfcdd6" font-size="12" text-anchor="middle">3</text>
    <text x="954" y="127" fill="#faf9fa" font-size="10">Add a variant</text>
    <circle cx="1053" cy="123" r="14" fill="#222027"/>
    <text x="1053" y="127" fill="#cfcdd6" font-size="12" text-anchor="middle">4</text>
    <text x="1075" y="127" fill="#faf9fa" font-size="11">Reuse it</text>
    <text x="690" y="197" fill="#faf9fa" font-size="24" font-weight="600" letter-spacing="-.5">Button</text>
    <text x="690" y="226" fill="#a5a0b1" font-size="14">Start with a ready-to-use component.</text>
    <rect x="817" y="287" width="176" height="48" rx="6" fill="#8b5cf6"/>
    <text x="905" y="317" text-anchor="middle" fill="white" font-size="16" font-weight="500">Get Started</text>
    <rect x="690" y="374" width="430" height="101" rx="8" fill="#222027" fill-opacity=".4" stroke="#3b3743" stroke-opacity=".6"/>
    <path d="M690 409h430" stroke="#3b3743" stroke-opacity=".3"/>
    <text x="706" y="397" fill="#cfcdd6" font-size="12">svelte</text>
    <g fill="none" stroke="#cfcdd6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1091" y="388" width="9" height="11" rx="1.5"/>
      <path d="M1094 385h8a1.5 1.5 0 0 1 1.5 1.5v8"/>
    </g>
    <text x="706" y="446" font-family="Consolas, Menlo, monospace" font-size="12"><tspan fill="#a5a0b1">&lt;</tspan><tspan fill="#c4b5fd">Button</tspan><tspan fill="#a5a0b1">&gt;</tspan><tspan fill="#e4e3e8">Get Started</tspan><tspan fill="#a5a0b1">&lt;/</tspan><tspan fill="#c4b5fd">Button</tspan><tspan fill="#a5a0b1">&gt;</tspan></text>
  </g>
</svg>
